<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recherche Belgique - Full Data</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #121212;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 50px;
      }
      .search-box {
        background: #1e1e1e;
        padding: 25px;
        border-radius: 12px;
        width: 400px;
        border: 1px solid #333;
      }
      h3 {
        margin-top: 0;
        color: #00cfb4;
      }
      input {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #252525;
        color: white;
        box-sizing: border-box;
        font-size: 16px;
      }
      .status {
        margin-top: 10px;
        font-size: 0.8em;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="search-box">
      <h3>Localités Belges</h3>
      <input
        type="text"
        id="cityInput"
        placeholder="Ex: Grez, 1390, Bruxelles..."
        list="all-cities"
        autocomplete="off"
      />
      <datalist id="all-cities"></datalist>
      <div id="status" class="status">Chargement des 2700+ localités...</div>
    </div>

    <script>
      const input = document.getElementById("cityInput");
      const datalist = document.getElementById("all-cities");
      const status = document.getElementById("status");
      let allCities = [];

      // On télécharge une liste complète des villes belges une seule fois au chargement
      // Source : Base de données open-data Belgique
      async function loadCities() {
        try {
          const response = await fetch(
            "https://raw.githubusercontent.com/lucas-f-dev/belgium-cities-json/main/belgium_cities.json",
          );
          allCities = await response.json();
          status.innerText = "Données prêtes (Toute la Belgique chargée)";
          status.style.color = "#00cfb4";
        } catch (err) {
          status.innerText = "Erreur de chargement des données.";
          console.error(err);
        }
      }

      input.addEventListener("input", (e) => {
        const val = e.target.value.toLowerCase().trim();
        datalist.innerHTML = "";

        if (val.length < 2) return;

        // On filtre dans la base complète chargée en mémoire
        const matches = allCities
          .filter(
            (c) =>
              c.zip.toString().startsWith(val) ||
              c.name.toLowerCase().includes(val),
          )
          .slice(0, 15); // On limite à 15 pour pas faire ramer le navigateur

        matches.forEach((city) => {
          const option = document.createElement("option");
          option.value = `${city.name} (${city.zip})`;
          datalist.appendChild(option);
        });
      });

      loadCities();
    </script>
  </body>
</html>
