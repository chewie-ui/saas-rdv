<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autocomplete adresse Belgique</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f9f9f9;
        }

        h2 { color: #333; }

        .address-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .results {
            position: absolute;
            top: 48px;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            display: none; /* Caché par défaut */
        }

        .results.active {
            display: block;
        }

        .result-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .result-item:hover {
            background: #f5f5f5;
        }

        #mapContainer {
            margin-top: 20px;
            width: 100%;
            height: 300px;
            background: #eee;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <h2>Localisation</h2>

    <div class="address-box">
        <input
            type="text"
            id="addressInput"
            placeholder="Tapez une adresse en Belgique..."
            autocomplete="chrome-off"
        />
        <div class="results" id="results"></div>
    </div>

    <div style="display: grid; grid-template-columns: 3fr 1fr; gap: 10px;">
        <input type="text" id="street" placeholder="Rue + numéro" />
        <input type="text" id="zip" placeholder="CP" />
    </div>
    <input type="text" id="city" placeholder="Ville" />
    <input type="text" id="country" placeholder="Pays" />

    <div id="mapContainer">
        <p style="text-align:center; padding-top:130px; color:#888;">La carte s'affichera ici</p>
    </div>

    <script>
        const addressInput = document.getElementById("addressInput");
        const results = document.getElementById("results");
        const streetInput = document.getElementById("street");
        const zipInput = document.getElementById("zip");
        const cityInput = document.getElementById("city");
        const countryInput = document.getElementById("country");
        const mapContainer = document.getElementById("mapContainer");

        let debounceTimer;

        addressInput.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            const query = addressInput.value.trim();

            if (query.length < 3) {
                results.innerHTML = "";
                results.classList.remove("active");
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    const url = "https://nominatim.openstreetmap.org/search?" + 
                        new URLSearchParams({
                            q: query,
                            format: "jsonv2",
                            addressdetails: "1",
                            countrycodes: "be",
                            limit: "5",
                        });

                    const response = await fetch(url, {
                        headers: {
                            "Accept-Language": "fr",
                            // User-Agent obligatoire pour Nominatim (évite le blocage)
                            "User-Agent": "MonAppRDV/1.0 (contact: test@example.com)"
                        },
                    });

                    const data = await response.json();

                    results.innerHTML = "";
                    if (!data.length) {
                        results.innerHTML = `<div class="result-item">Aucun résultat</div>`;
                        results.classList.add("active");
                        return;
                    }

                    data.forEach((item) => {
                        const div = document.createElement("div");
                        div.className = "result-item";
                        div.textContent = item.display_name;

                        div.addEventListener("click", () => {
                            const address = item.address || {};

                            // Format Belge : Rue Numéro
                            streetInput.value = [address.road, address.house_number]
                                .filter(Boolean)
                                .join(" ");

                            zipInput.value = address.postcode || "";
                            cityInput.value = address.city || address.town || address.village || "";
                            countryInput.value = address.country || "Belgique";

                            addressInput.value = item.display_name;
                            results.innerHTML = "";
                            results.classList.remove("active");

                            // MISE À JOUR DE LA CARTE
                            updateMap(item.display_name);
                        });

                        results.appendChild(div);
                    });
                    results.classList.add("active");

                } catch (error) {
                    console.error("Erreur Nominatim :", error);
                }
            }, 500);
        });

        // Fonction pour générer l'iframe Google Maps
        function updateMap(fullAddress) {
            const encoded = encodeURIComponent(fullAddress);
            // On utilise l'URL embed gratuite de Google (q= est crucial pour centrer)
            const mapUrl = `https://maps.google.com/maps?q=${encoded}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            
            mapContainer.innerHTML = `
                <iframe 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    src="${mapUrl}" 
                    style="border:0;" 
                    allowfullscreen>
                </iframe>`;
        }

        // Fermer la liste si on clique ailleurs
        document.addEventListener("click", (e) => {
            if (!e.target.closest(".address-box")) {
                results.innerHTML = "";
                results.classList.remove("active");
            }
        });
    </script>
</body>
</html>
