<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration : création d'une page de réservation personnalisée">
  <defs>
    <linearGradient id="bp-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef6f0"/>
      <stop offset="1" stop-color="#f7f5f1"/>
    </linearGradient>
    <linearGradient id="bp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4faf6"/>
    </linearGradient>
    <linearGradient id="bp-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28a06a"/>
      <stop offset="1" stop-color="#1e7a4e"/>
    </linearGradient>
    <filter id="bp-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0c0d0e" flood-opacity="0.14"/>
    </filter>
    <filter id="bp-shadow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0d0e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="28" fill="url(#bp-bg)"/>

  <!-- decorative dots -->
  <circle cx="100" cy="92" r="5" fill="#bfe3cf"/>
  <circle cx="702" cy="500" r="6" fill="#bfe3cf"/>
  <circle cx="664" cy="118" r="4" fill="#9fd6bb"/>
  <circle cx="118" cy="486" r="4" fill="#9fd6bb"/>

  <!-- main builder card -->
  <g filter="url(#bp-shadow)">
    <rect x="180" y="118" width="440" height="346" rx="22" fill="url(#bp-card)" stroke="#e2e0db"/>
  </g>
  <rect x="180" y="118" width="440" height="46" rx="22" fill="#ffffff"/>
  <rect x="180" y="140" width="440" height="24" fill="#ffffff"/>
  <circle cx="208" cy="141" r="6" fill="#f3a6a0"/>
  <circle cx="230" cy="141" r="6" fill="#f6d188"/>
  <circle cx="252" cy="141" r="6" fill="#9fd6bb"/>
  <rect x="290" y="135" width="220" height="12" rx="6" fill="#eef0ee"/>

  <!-- mini calendar grid -->
  <rect x="208" y="190" width="170" height="132" rx="14" fill="#ffffff" stroke="#eceae4"/>
  <rect x="208" y="190" width="170" height="34" rx="14" fill="#f4faf6"/>
  <rect x="222" y="201" width="60" height="10" rx="5" fill="#1e7a4e" opacity="0.65"/>
  <g fill="#eef0ee">
    <rect x="222" y="240" width="20" height="20" rx="5"/>
    <rect x="250" y="240" width="20" height="20" rx="5"/>
    <rect x="278" y="240" width="20" height="20" rx="5"/>
    <rect x="306" y="240" width="20" height="20" rx="5"/>
    <rect x="334" y="240" width="20" height="20" rx="5"/>
    <rect x="222" y="270" width="20" height="20" rx="5"/>
    <rect x="278" y="270" width="20" height="20" rx="5"/>
    <rect x="306" y="270" width="20" height="20" rx="5"/>
    <rect x="334" y="270" width="20" height="20" rx="5"/>
  </g>
  <rect x="250" y="270" width="20" height="20" rx="5" fill="url(#bp-accent)"/>

  <!-- service rows being configured -->
  <rect x="394" y="196" width="194" height="40" rx="12" fill="#ffffff" stroke="#eceae4"/>
  <circle cx="416" cy="216" r="10" fill="#e8f5ee"/>
  <rect x="436" y="210" width="100" height="8" rx="4" fill="#dfe3df"/>
  <rect x="436" y="224" width="60" height="6" rx="3" fill="#eceae4"/>

  <rect x="394" y="244" width="194" height="40" rx="12" fill="#ffffff" stroke="#eceae4"/>
  <circle cx="416" cy="264" r="10" fill="#e8f5ee"/>
  <rect x="436" y="258" width="120" height="8" rx="4" fill="#dfe3df"/>
  <rect x="436" y="272" width="70" height="6" rx="3" fill="#eceae4"/>

  <rect x="394" y="292" width="194" height="40" rx="12" fill="#ffffff" stroke="#eceae4"/>
  <circle cx="416" cy="312" r="10" fill="#e8f5ee"/>
  <rect x="436" y="306" width="90" height="8" rx="4" fill="#dfe3df"/>
  <rect x="436" y="320" width="50" height="6" rx="3" fill="#eceae4"/>

  <!-- CTA bar -->
  <rect x="208" y="400" width="380" height="40" rx="20" fill="url(#bp-accent)"/>
  <rect x="248" y="416" width="120" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="556" cy="420" r="10" fill="#ffffff" opacity="0.85"/>

  <!-- floating colour-palette swatch -->
  <g filter="url(#bp-shadow-sm)">
    <rect x="96" y="218" width="100" height="92" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="124" cy="250" r="14" fill="#1e7a4e"/>
  <circle cx="156" cy="250" r="14" fill="#f6d188"/>
  <circle cx="124" cy="282" r="14" fill="#7fb8e0"/>
  <circle cx="156" cy="282" r="14" fill="#f3a6a0"/>

  <!-- floating toggle pill -->
  <g filter="url(#bp-shadow-sm)">
    <rect x="556" y="76" width="120" height="46" rx="23" fill="#ffffff"/>
  </g>
  <rect x="568" y="88" width="96" height="22" rx="11" fill="#e8f5ee"/>
  <circle cx="644" cy="99" r="13" fill="url(#bp-accent)"/>

  <!-- floating cursor -->
  <g filter="url(#bp-shadow-sm)" transform="translate(556,356)">
    <path d="M0 0 L0 46 L12 34 L22 56 L32 51 L22 29 L40 29 Z" fill="#0c0d0e"/>
  </g>
</svg>
