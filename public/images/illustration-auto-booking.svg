<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration : un client réserve seul un rendez-vous, 24h/24">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef6f0"/>
      <stop offset="1" stop-color="#f7f5f1"/>
    </linearGradient>
    <linearGradient id="ab-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4faf6"/>
    </linearGradient>
    <linearGradient id="ab-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28a06a"/>
      <stop offset="1" stop-color="#1e7a4e"/>
    </linearGradient>
    <filter id="ab-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0c0d0e" flood-opacity="0.14"/>
    </filter>
    <filter id="ab-shadow-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0d0e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="28" fill="url(#ab-bg)"/>

  <circle cx="120" cy="100" r="5" fill="#bfe3cf"/>
  <circle cx="688" cy="486" r="6" fill="#bfe3cf"/>
  <circle cx="652" cy="142" r="4" fill="#9fd6bb"/>
  <circle cx="142" cy="468" r="4" fill="#9fd6bb"/>

  <!-- phone mockup -->
  <g filter="url(#ab-shadow)">
    <rect x="290" y="84" width="230" height="426" rx="36" fill="url(#ab-card)" stroke="#e2e0db"/>
  </g>
  <rect x="310" y="112" width="190" height="368" rx="18" fill="#ffffff"/>
  <rect x="380" y="122" width="50" height="8" rx="4" fill="#eceae4"/>

  <!-- calendar block in phone -->
  <rect x="330" y="152" width="150" height="120" rx="14" fill="#f4faf6" stroke="#e8f5ee"/>
  <rect x="346" y="166" width="70" height="10" rx="5" fill="#1e7a4e" opacity="0.65"/>
  <g fill="#ffffff" stroke="#e2e0db">
    <rect x="346" y="190" width="22" height="22" rx="6"/>
    <rect x="376" y="190" width="22" height="22" rx="6"/>
    <rect x="406" y="190" width="22" height="22" rx="6"/>
    <rect x="436" y="190" width="22" height="22" rx="6"/>
    <rect x="346" y="220" width="22" height="22" rx="6"/>
    <rect x="406" y="220" width="22" height="22" rx="6"/>
    <rect x="436" y="220" width="22" height="22" rx="6"/>
  </g>
  <circle cx="387" cy="231" r="13" fill="url(#ab-accent)"/>
  <path d="M381 231 L386 236 L394 226" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- confirmation card -->
  <rect x="330" y="290" width="150" height="76" rx="14" fill="#ffffff" stroke="#eceae4"/>
  <circle cx="356" cy="328" r="16" fill="#e8f5ee"/>
  <path d="M349 328 L355 334 L365 321" stroke="#1e7a4e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="382" y="318" width="80" height="8" rx="4" fill="#dfe3df"/>
  <rect x="382" y="334" width="56" height="6" rx="3" fill="#eceae4"/>

  <!-- bottom CTA -->
  <rect x="330" y="386" width="150" height="36" rx="18" fill="url(#ab-accent)"/>
  <rect x="364" y="400" width="82" height="8" rx="4" fill="#ffffff" opacity="0.85"/>

  <!-- floating clock badge : 24/7 -->
  <g filter="url(#ab-shadow-sm)">
    <circle cx="172" cy="224" r="62" fill="#ffffff"/>
  </g>
  <circle cx="172" cy="224" r="46" fill="#f4faf6" stroke="#e8f5ee" stroke-width="2"/>
  <path d="M172 224 L172 196" stroke="#1e7a4e" stroke-width="4" stroke-linecap="round"/>
  <path d="M172 224 L192 236" stroke="#1e7a4e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="172" cy="224" r="4" fill="#1e7a4e"/>
  <text x="172" y="305" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#0c0d0e">24/7</text>

  <!-- floating notification bubble -->
  <g filter="url(#ab-shadow-sm)">
    <rect x="538" y="226" width="172" height="64" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="570" cy="258" r="16" fill="#e8f5ee"/>
  <path d="M563 258 L569 264 L579 251" stroke="#1e7a4e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="598" y="250" width="96" height="8" rx="4" fill="#dfe3df"/>
  <rect x="598" y="264" width="68" height="6" rx="3" fill="#eceae4"/>

  <!-- sparkles -->
  <circle cx="600" cy="146" r="7" fill="url(#ab-accent)"/>
  <circle cx="226" cy="430" r="6" fill="#f6d188"/>
</svg>
