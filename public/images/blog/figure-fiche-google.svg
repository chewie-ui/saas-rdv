<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Les éléments d'une fiche d'établissement complète, du plus au moins déterminant">
  <!-- Figure de l'article « Se faire trouver sur Google » : ce qui compose une
       fiche complète, et le champ « lien de réservation » que presque personne
       ne remplit. -->
  <rect width="900" height="460" fill="#ffffff"/>

  <!-- La fiche -->
  <rect x="40" y="40" width="420" height="380" rx="22" fill="#f4f8f5"/>
  <rect x="40" y="40" width="420" height="96" rx="22" fill="#1e7a4e"/>
  <rect x="40" y="106" width="420" height="30" fill="#1e7a4e"/>
  <circle cx="98" cy="88" r="26" fill="#ffffff" opacity="0.9"/>
  <rect x="142" y="74" width="190" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <rect x="142" y="98" width="120" height="10" rx="5" fill="#ffffff" opacity="0.5"/>

  <g font-family="system-ui, sans-serif" font-size="14" fill="#0f2419">
    <text x="74" y="180" font-weight="600">Catégorie exacte du métier</text>
    <text x="74" y="222" font-weight="600">Horaires réels, à jour</text>
    <text x="74" y="264" font-weight="600">Photos récentes</text>
    <text x="74" y="306" font-weight="600">Prestations, mots des clients</text>
    <text x="74" y="348" font-weight="600" fill="#1e7a4e">Lien de réservation</text>
    <text x="74" y="392" font-size="13" fill-opacity="0.5">Avis, et réponses aux avis</text>
  </g>

  <!-- Puces -->
  <g fill="#1e7a4e">
    <circle cx="58" cy="175" r="5"/>
    <circle cx="58" cy="217" r="5"/>
    <circle cx="58" cy="259" r="5"/>
    <circle cx="58" cy="301" r="5"/>
    <circle cx="58" cy="343" r="7"/>
    <circle cx="58" cy="387" r="5" opacity="0.5"/>
  </g>

  <!-- Encadré sur le champ oublié -->
  <rect x="48" y="326" width="404" height="34" rx="10" fill="none"
        stroke="#e8a33d" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M460 343h60" stroke="#e8a33d" stroke-width="3" stroke-linecap="round"/>

  <rect x="530" y="286" width="330" height="118" rx="18" fill="#f6f2ea"/>
  <text x="558" y="326" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b97a1c">
    Le champ que presque
  </text>
  <text x="558" y="350" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b97a1c">
    personne ne remplit
  </text>
  <text x="558" y="378" font-family="system-ui, sans-serif" font-size="13" fill="#0f2419" fill-opacity="0.65">
    Il transforme une recherche en
  </text>
  <text x="558" y="396" font-family="system-ui, sans-serif" font-size="13" fill="#0f2419" fill-opacity="0.65">
    rendez-vous, sans coup de fil.
  </text>

  <!-- Ce qui pèse le plus -->
  <text x="530" y="76" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f2419">
    Poids sur le classement local
  </text>
  <g>
    <rect x="530" y="98" width="290" height="26" rx="13" fill="#1e7a4e"/>
    <text x="546" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Fiche complète et à jour</text>

    <rect x="530" y="140" width="230" height="26" rx="13" fill="#1e7a4e" opacity="0.75"/>
    <text x="546" y="158" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Nombre et fraîcheur des avis</text>

    <rect x="530" y="182" width="160" height="26" rx="13" fill="#1e7a4e" opacity="0.5"/>
    <text x="546" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Cohérence des infos</text>

    <rect x="530" y="224" width="100" height="26" rx="13" fill="#1e7a4e" opacity="0.28"/>
    <text x="546" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Site web</text>
  </g>
</svg>
