<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Une récurrence déplace tout le bloc, des séances indépendantes ne bougent qu'une seule fois">
  <!-- Figure de l'article kiné : la différence entre une « récurrence » et une
       série de rendez-vous indépendants, quand le patient déplace une séance. -->
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- ── Haut : la récurrence ── -->
  <text x="40" y="46" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#b97a1c">
    Récurrence : déplacer une séance déplace tout
  </text>
  <g>
    <rect x="40" y="66" width="820" height="110" rx="18" fill="#f6f2ea"/>
    <g fill="#e8a33d">
      <rect x="76" y="98" width="96" height="46" rx="12"/>
      <rect x="212" y="98" width="96" height="46" rx="12"/>
      <rect x="348" y="98" width="96" height="46" rx="12"/>
      <rect x="484" y="98" width="96" height="46" rx="12"/>
      <rect x="620" y="98" width="96" height="46" rx="12"/>
      <rect x="756" y="98" width="72" height="46" rx="12"/>
    </g>
    <!-- Le bloc entier glisse -->
    <g stroke="#b97a1c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M76 158h752"/>
      <path d="M814 150l14 8-14 8"/>
    </g>
  </g>
  <text x="40" y="196" font-family="system-ui, sans-serif" font-size="13" fill="#0f2419" fill-opacity="0.6">
    Le patient décale le mardi 12 — les cinq autres séances bougent avec.
  </text>

  <!-- ── Bas : les séances indépendantes ── -->
  <text x="40" y="264" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1e7a4e">
    Séances indépendantes : une seule bouge
  </text>
  <g>
    <rect x="40" y="284" width="820" height="110" rx="18" fill="#eef6f1"/>
    <g fill="#1e7a4e">
      <rect x="76" y="316" width="96" height="46" rx="12"/>
      <rect x="212" y="316" width="96" height="46" rx="12"/>
      <rect x="484" y="316" width="96" height="46" rx="12"/>
      <rect x="620" y="316" width="96" height="46" rx="12"/>
      <rect x="756" y="316" width="72" height="46" rx="12"/>
    </g>
    <!-- L'emplacement libéré -->
    <rect x="348" y="316" width="96" height="46" rx="12" fill="none"
          stroke="#1e7a4e" stroke-width="3" stroke-dasharray="10 8" opacity="0.7"/>
    <!-- La séance déplacée -->
    <rect x="348" y="366" width="96" height="22" rx="11" fill="#1e7a4e" opacity="0.55"/>
    <g stroke="#1e7a4e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M396 364v-2"/>
      <path d="M388 356l8-8 8 8" transform="translate(0 14)"/>
    </g>
  </g>
</svg>
