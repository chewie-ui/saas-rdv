<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Une pile de messages qui devient un agenda ordonné">
  <!-- Couverture : « Prendre ses rendez-vous par WhatsApp »
       À gauche l'empilement de bulles qui part dans tous les sens, à droite
       le même contenu rangé. La flèche au milieu porte tout le propos. -->
  <rect width="1200" height="750" fill="#f2f7f4"/>

  <!-- ── Gauche : la conversation qui déborde ── -->
  <g>
    <rect x="90" y="150" width="300" height="70" rx="24" fill="#ffffff"/>
    <rect x="120" y="176" width="180" height="12" rx="6" fill="#0f2419" opacity="0.22"/>

    <rect x="180" y="244" width="250" height="70" rx="24" fill="#a7d9bf"/>
    <rect x="210" y="270" width="140" height="12" rx="6" fill="#0f2419" opacity="0.3"/>

    <rect x="70" y="338" width="330" height="70" rx="24" fill="#ffffff"/>
    <rect x="100" y="364" width="210" height="12" rx="6" fill="#0f2419" opacity="0.22"/>

    <rect x="200" y="432" width="230" height="70" rx="24" fill="#a7d9bf"/>
    <rect x="230" y="458" width="120" height="12" rx="6" fill="#0f2419" opacity="0.3"/>

    <rect x="110" y="526" width="290" height="70" rx="24" fill="#ffffff"/>
    <rect x="140" y="552" width="170" height="12" rx="6" fill="#0f2419" opacity="0.22"/>

    <!-- La bulle de trop, en débordement -->
    <rect x="160" y="620" width="250" height="70" rx="24" fill="#e8a33d" opacity="0.85"/>
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
      <path d="M262 645l46 20M262 665l46-20"/>
    </g>
  </g>

  <!-- ── Flèche ── -->
  <g stroke="#1e7a4e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M480 400h150"/>
    <path d="M600 372l30 28-30 28"/>
  </g>

  <!-- ── Droite : l'agenda rangé ── -->
  <rect x="690" y="180" width="430" height="440" rx="28" fill="#ffffff"/>
  <rect x="690" y="180" width="430" height="74" rx="28" fill="#1e7a4e"/>
  <rect x="690" y="230" width="430" height="24" fill="#1e7a4e"/>
  <g fill="#ffffff" opacity="0.85">
    <rect x="726" y="208" width="120" height="14" rx="7"/>
    <circle cx="1078" cy="215" r="12"/>
  </g>

  <g>
    <rect x="726" y="292" width="358" height="66" rx="16" fill="#eef6f1"/>
    <rect x="746" y="316" width="10" height="18" rx="5" fill="#1e7a4e"/>
    <rect x="776" y="316" width="180" height="12" rx="6" fill="#0f2419" opacity="0.28"/>

    <rect x="726" y="378" width="358" height="66" rx="16" fill="#eef6f1"/>
    <rect x="746" y="402" width="10" height="18" rx="5" fill="#1e7a4e"/>
    <rect x="776" y="402" width="230" height="12" rx="6" fill="#0f2419" opacity="0.28"/>

    <rect x="726" y="464" width="358" height="66" rx="16" fill="#eef6f1"/>
    <rect x="746" y="488" width="10" height="18" rx="5" fill="#1e7a4e"/>
    <rect x="776" y="488" width="150" height="12" rx="6" fill="#0f2419" opacity="0.28"/>
  </g>

  <!-- Coche : plus rien à trier -->
  <circle cx="1096" cy="566" r="42" fill="#1e7a4e"/>
  <path d="M1076 566l14 15 26-30" fill="none" stroke="#ffffff" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
