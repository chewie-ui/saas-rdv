<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Une recherche locale, une carte et une fiche d'établissement">
  <!-- Couverture : « Se faire trouver sur Google »
       Barre de recherche, ondes de proximité autour d'un point, et la fiche
       qui remonte — l'enchaînement décrit dans l'article. -->
  <rect width="1200" height="750" fill="#f2f7f4"/>

  <!-- Carte stylisée en fond -->
  <g opacity="0.5">
    <path d="M0 470l180-70 200 60 210-90 230 80 200-70 180 60v320H0z" fill="#dcece3"/>
    <g stroke="#1e7a4e" stroke-opacity="0.22" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M120 750V560l180-70 190 60"/>
      <path d="M1080 750V600l-180-60-200 70"/>
      <path d="M470 750V610l230-80"/>
    </g>
  </g>

  <!-- Barre de recherche -->
  <rect x="180" y="110" width="600" height="94" rx="47" fill="#ffffff"/>
  <circle cx="252" cy="157" r="22" fill="none" stroke="#1e7a4e" stroke-width="7"/>
  <path d="M268 173l22 22" stroke="#1e7a4e" stroke-width="7" stroke-linecap="round"/>
  <rect x="304" y="150" width="230" height="14" rx="7" fill="#0f2419" opacity="0.35"/>
  <rect x="548" y="150" width="110" height="14" rx="7" fill="#1e7a4e" opacity="0.55"/>

  <!-- Ondes de proximité -->
  <g fill="none" stroke="#1e7a4e" stroke-width="5" opacity="0.35">
    <circle cx="430" cy="470" r="70"/>
    <circle cx="430" cy="470" r="120" opacity="0.6"/>
    <circle cx="430" cy="470" r="170" opacity="0.3"/>
  </g>

  <!-- Épingle -->
  <g transform="translate(430 452)">
    <path d="M0-72c-38 0-68 30-68 68 0 50 68 116 68 116s68-66 68-116c0-38-30-68-68-68z" fill="#1e7a4e"/>
    <circle cx="0" cy="-6" r="26" fill="#ffffff"/>
  </g>

  <!-- Fiche d'établissement -->
  <rect x="700" y="284" width="400" height="316" rx="26" fill="#ffffff"/>
  <rect x="700" y="284" width="400" height="96" rx="26" fill="#1e7a4e"/>
  <rect x="700" y="350" width="400" height="30" fill="#1e7a4e"/>
  <circle cx="762" cy="332" r="26" fill="#ffffff" opacity="0.9"/>
  <rect x="804" y="318" width="180" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <rect x="804" y="342" width="120" height="10" rx="5" fill="#ffffff" opacity="0.55"/>

  <!-- Étoiles -->
  <g fill="#e8a33d" transform="translate(736 418)">
    <path d="M0-16l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z"/>
    <path d="M44-16l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z"/>
    <path d="M88-16l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z"/>
    <path d="M132-16l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z"/>
    <path d="M176-16l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" opacity="0.35"/>
  </g>

  <!-- Lignes d'infos -->
  <g fill="#0f2419" opacity="0.2">
    <rect x="736" y="466" width="300" height="12" rx="6"/>
    <rect x="736" y="496" width="240" height="12" rx="6"/>
  </g>

  <!-- Bouton « prendre rendez-vous » -->
  <rect x="736" y="532" width="230" height="46" rx="23" fill="#1e7a4e"/>
  <rect x="762" y="549" width="140" height="12" rx="6" fill="#ffffff" opacity="0.9"/>
</svg>
