<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Ce qui s'automatise d'un côté, ce qui reste sur WhatsApp de l'autre">
  <!-- Figure de l'article WhatsApp : le découpage recommandé, automatiser le
       mécanique et garder l'humain. -->
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Colonne gauche : automatisé -->
  <rect x="40" y="40" width="390" height="330" rx="22" fill="#eef6f1"/>
  <text x="70" y="86" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e7a4e">
    Ce qui passe sur un lien
  </text>
  <text x="70" y="110" font-family="system-ui, sans-serif" font-size="14" fill="#0f2419" fill-opacity="0.6">
    Mécanique, sans valeur ajoutée
  </text>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#0f2419">
    <g transform="translate(70 150)">
      <circle cx="10" cy="-5" r="12" fill="#1e7a4e"/>
      <path d="M4-5l5 6 9-11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="0">Proposer les créneaux libres</text>
    </g>
    <g transform="translate(70 200)">
      <circle cx="10" cy="-5" r="12" fill="#1e7a4e"/>
      <path d="M4-5l5 6 9-11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="0">Confirmer le rendez-vous</text>
    </g>
    <g transform="translate(70 250)">
      <circle cx="10" cy="-5" r="12" fill="#1e7a4e"/>
      <path d="M4-5l5 6 9-11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="0">Rappeler la veille</text>
    </g>
    <g transform="translate(70 300)">
      <circle cx="10" cy="-5" r="12" fill="#1e7a4e"/>
      <path d="M4-5l5 6 9-11" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="0">Encaisser une annulation</text>
    </g>
  </g>

  <!-- Colonne droite : humain -->
  <rect x="470" y="40" width="390" height="330" rx="22" fill="#f6f2ea"/>
  <text x="500" y="86" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#b97a1c">
    Ce qui reste sur WhatsApp
  </text>
  <text x="500" y="110" font-family="system-ui, sans-serif" font-size="14" fill="#0f2419" fill-opacity="0.6">
    Relationnel, irremplaçable
  </text>
  <g font-family="system-ui, sans-serif" font-size="15" fill="#0f2419">
    <g transform="translate(500 150)">
      <circle cx="10" cy="-5" r="12" fill="#e8a33d"/>
      <path d="M10-12v9M10 2v1" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="36" y="0">Les questions avant de venir</text>
    </g>
    <g transform="translate(500 200)">
      <circle cx="10" cy="-5" r="12" fill="#e8a33d"/>
      <path d="M10-12v9M10 2v1" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="36" y="0">« Je serai un peu en retard »</text>
    </g>
    <g transform="translate(500 250)">
      <circle cx="10" cy="-5" r="12" fill="#e8a33d"/>
      <path d="M10-12v9M10 2v1" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="36" y="0">Le suivi après la séance</text>
    </g>
    <g transform="translate(500 300)">
      <circle cx="10" cy="-5" r="12" fill="#e8a33d"/>
      <path d="M10-12v9M10 2v1" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="36" y="0">Le lien que vous avez avec eux</text>
    </g>
  </g>
</svg>
