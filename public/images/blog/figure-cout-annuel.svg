<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Coût cumulé sur douze mois : l'abonnement fixe reste plat, la commission grimpe">
  <!-- Figure de l'article « Combien coûte un logiciel de prise de rendez-vous ».
       Reprend l'exemple chiffré du texte : 60 rendez-vous à 45 € par mois,
       commission de 20 % contre abonnement de 30 €. -->
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Axes -->
  <g stroke="#0f2419" stroke-opacity="0.18" stroke-width="2">
    <path d="M96 40v300M96 340h760"/>
  </g>
  <g stroke="#0f2419" stroke-opacity="0.07" stroke-width="2">
    <path d="M96 265h760M96 190h760M96 115h760M96 40h760"/>
  </g>

  <!-- Graduations verticales -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#0f2419" fill-opacity="0.5" text-anchor="end">
    <text x="84" y="345">0 €</text>
    <text x="84" y="270">1 600 €</text>
    <text x="84" y="195">3 200 €</text>
    <text x="84" y="120">4 800 €</text>
    <text x="84" y="45">6 480 €</text>
  </g>

  <!-- Mois -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#0f2419" fill-opacity="0.5" text-anchor="middle">
    <text x="96" y="368">M1</text>
    <text x="286" y="368">M4</text>
    <text x="476" y="368">M7</text>
    <text x="666" y="368">M10</text>
    <text x="856" y="368">M12</text>
  </g>

  <!-- Commission 20 % : 540 €/mois cumulés -->
  <path d="M96 340 L856 40" fill="none" stroke="#e8a33d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="856" cy="40" r="9" fill="#e8a33d"/>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#b97a1c">
    <text x="600" y="118">Commission 20 %</text>
    <text x="600" y="140" font-size="14" font-weight="400" fill="#0f2419" fill-opacity="0.6">6 480 € sur l'année</text>
  </g>

  <!-- Abonnement 30 €/mois : 360 € cumulés -->
  <path d="M96 340 L856 323" fill="none" stroke="#1e7a4e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="856" cy="323" r="9" fill="#1e7a4e"/>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e7a4e">
    <text x="200" y="316">Abonnement fixe 30 €/mois</text>
    <text x="200" y="336" font-size="14" font-weight="400" fill="#0f2419" fill-opacity="0.6">360 € sur l'année</text>
  </g>

  <!-- Rappel de l'hypothèse -->
  <text x="96" y="26" font-family="system-ui, sans-serif" font-size="13" fill="#0f2419" fill-opacity="0.45">
    Hypothèse : 60 rendez-vous par mois à 45 €
  </text>
</svg>
