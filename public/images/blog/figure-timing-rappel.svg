<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Un rappel envoyé la veille laisse le temps de replacer le créneau, deux heures avant non">
  <!-- Figure de l'article « Rendez-vous non honorés » : pourquoi le moment
       du rappel compte davantage que le rappel lui-même. -->
  <rect width="900" height="300" fill="#ffffff"/>

  <!-- Ligne de temps -->
  <path d="M70 190h770" stroke="#0f2419" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"/>
  <g fill="#0f2419" fill-opacity="0.2">
    <circle cx="150" cy="190" r="7"/>
    <circle cx="640" cy="190" r="7"/>
  </g>

  <!-- Rendez-vous -->
  <g transform="translate(800 190)">
    <circle cx="0" cy="0" r="20" fill="#1e7a4e"/>
    <path d="M-8 0l6 7 12-14" fill="none" stroke="#ffffff" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="240" font-family="system-ui, sans-serif" font-size="15" font-weight="700"
        fill="#1e7a4e" text-anchor="middle">Rendez-vous</text>

  <!-- Bon moment : la veille -->
  <g transform="translate(150 190)">
    <circle cx="0" cy="0" r="26" fill="#1e7a4e"/>
    <path d="M0-13c-8 0-13 6-13 13 0 8-3 11-5 14-1 1 0 3 2 3h32c2 0 3-2 2-3-2-3-5-6-5-14 0-7-5-13-13-13z" fill="#ffffff"/>
    <path d="M-5 20a5 5 0 0 0 10 0z" fill="#ffffff"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="150" y="122" font-size="16" font-weight="700" fill="#1e7a4e">La veille</text>
    <text x="150" y="146" font-size="14" fill="#0f2419" fill-opacity="0.6">le rappel utile</text>
    <text x="150" y="240" font-size="13" fill="#0f2419" fill-opacity="0.5">J−1, fin de matinée</text>
  </g>

  <!-- Zone utile -->
  <rect x="150" y="176" width="490" height="28" rx="14" fill="#1e7a4e" opacity="0.12"/>
  <text x="395" y="196" font-family="system-ui, sans-serif" font-size="14" font-weight="600"
        fill="#1e7a4e" text-anchor="middle">Le créneau peut encore être replacé</text>

  <!-- Mauvais moment : 2 h avant -->
  <g transform="translate(640 190)">
    <circle cx="0" cy="0" r="26" fill="#e8a33d"/>
    <path d="M-9-9l18 18M9-9l-18 18" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="640" y="122" font-size="16" font-weight="700" fill="#b97a1c">2 h avant</text>
    <text x="640" y="146" font-size="14" fill="#0f2419" fill-opacity="0.6">trop tard</text>
    <text x="640" y="240" font-size="13" fill="#0f2419" fill-opacity="0.5">le trou reste</text>
  </g>

  <!-- Zone perdue -->
  <rect x="640" y="176" width="160" height="28" rx="14" fill="#e8a33d" opacity="0.16"/>
</svg>
