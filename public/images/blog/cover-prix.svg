<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Trois modèles de tarification comparés">
  <!-- Couverture : « Combien coûte un logiciel de prise de rendez-vous »
       Trois colonnes de hauteurs très différentes = le propos de l'article,
       à savoir que deux tarifs affichés identiques ne coûtent pas pareil. -->
  <rect width="1200" height="750" fill="#f2f7f4"/>

  <!-- Trame de fond, discrète -->
  <g stroke="#1e7a4e" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 190h1200M0 330h1200M0 470h1200M0 610h1200"/>
  </g>

  <!-- Socle -->
  <rect x="150" y="612" width="900" height="6" rx="3" fill="#1e7a4e" opacity="0.25"/>

  <!-- Colonne 1 — abonnement fixe (basse) -->
  <rect x="215" y="470" width="180" height="142" rx="16" fill="#1e7a4e"/>
  <rect x="215" y="470" width="180" height="40" rx="16" fill="#ffffff" opacity="0.18"/>
  <circle cx="305" cy="424" r="26" fill="#ffffff" stroke="#1e7a4e" stroke-width="5"/>
  <path d="M312 412c-4-3-11-3-14 2-3 5-3 15 0 20 3 5 10 5 14 2M296 419h16M296 428h16"
        fill="none" stroke="#1e7a4e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Colonne 2 — gratuit annuaire (moyenne) -->
  <rect x="510" y="366" width="180" height="246" rx="16" fill="#3d7fa8"/>
  <rect x="510" y="366" width="180" height="40" rx="16" fill="#ffffff" opacity="0.18"/>
  <circle cx="600" cy="320" r="26" fill="#ffffff" stroke="#3d7fa8" stroke-width="5"/>
  <path d="M607 308c-4-3-11-3-14 2-3 5-3 15 0 20 3 5 10 5 14 2M591 315h16M591 324h16"
        fill="none" stroke="#3d7fa8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Colonne 3 — commission (très haute) -->
  <rect x="805" y="176" width="180" height="436" rx="16" fill="#e8a33d"/>
  <rect x="805" y="176" width="180" height="40" rx="16" fill="#ffffff" opacity="0.22"/>
  <circle cx="895" cy="130" r="26" fill="#ffffff" stroke="#e8a33d" stroke-width="5"/>
  <path d="M902 118c-4-3-11-3-14 2-3 5-3 15 0 20 3 5 10 5 14 2M886 125h16M886 134h16"
        fill="none" stroke="#e8a33d" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Flèche d'écart entre la plus basse et la plus haute -->
  <g stroke="#0f2419" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M1060 470v142"/>
    <path d="M1052 478l8-8 8 8M1052 604l8 8 8-8"/>
  </g>
  <rect x="1018" y="516" width="84" height="50" rx="12" fill="#0f2419" opacity="0.85"/>
  <path d="M1044 532c-4-3-11-3-14 2-3 5-3 15 0 20 3 5 10 5 14 2M1028 539h16M1028 548h16"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M1064 528l14 26-14 -6z" fill="#ffffff" opacity="0.9"/>
</svg>
