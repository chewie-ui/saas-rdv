<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Une semaine d'agenda avec un créneau resté vide">
  <!-- Couverture : « Rendez-vous non honorés »
       Une semaine remplie, un seul créneau en pointillés : le trou qui ne se
       rattrape pas. La cloche de rappel pointe vers ce trou. -->
  <rect width="1200" height="750" fill="#f2f7f4"/>

  <!-- Carte agenda -->
  <rect x="110" y="120" width="820" height="520" rx="28" fill="#ffffff"/>
  <rect x="110" y="120" width="820" height="86" rx="28" fill="#1e7a4e"/>
  <rect x="110" y="178" width="820" height="28" fill="#1e7a4e"/>

  <!-- Pastilles d'en-tête (jours) -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="160" y="152" width="86" height="12" rx="6"/>
    <rect x="290" y="152" width="86" height="12" rx="6"/>
    <rect x="420" y="152" width="86" height="12" rx="6"/>
    <rect x="550" y="152" width="86" height="12" rx="6"/>
    <rect x="680" y="152" width="86" height="12" rx="6"/>
    <rect x="810" y="152" width="70" height="12" rx="6"/>
  </g>

  <!-- Rendez-vous pris -->
  <g fill="#a7d9bf">
    <rect x="160" y="242" width="86" height="96" rx="12"/>
    <rect x="290" y="242" width="86" height="60" rx="12"/>
    <rect x="420" y="242" width="86" height="120" rx="12"/>
    <rect x="680" y="242" width="86" height="80" rx="12"/>
    <rect x="810" y="242" width="70" height="110" rx="12"/>
    <rect x="160" y="392" width="86" height="70" rx="12"/>
    <rect x="290" y="336" width="86" height="126" rx="12"/>
    <rect x="420" y="396" width="86" height="66" rx="12"/>
    <rect x="680" y="356" width="86" height="106" rx="12"/>
    <rect x="160" y="496" width="86" height="90" rx="12"/>
    <rect x="420" y="496" width="86" height="90" rx="12"/>
    <rect x="810" y="386" width="70" height="76" rx="12"/>
  </g>

  <!-- Le créneau perdu -->
  <rect x="550" y="242" width="86" height="220" rx="12" fill="#ffffff"
        stroke="#e8a33d" stroke-width="5" stroke-dasharray="16 12"/>
  <g stroke="#e8a33d" stroke-width="7" stroke-linecap="round">
    <path d="M568 330l50 50M618 330l-50 50"/>
  </g>

  <!-- Cloche de rappel, posée sur le créneau vide -->
  <g transform="translate(940 300)">
    <circle cx="0" cy="0" r="86" fill="#1e7a4e"/>
    <path d="M0-40c-20 0-34 15-34 34 0 22-6 30-13 37-3 3-1 9 4 9h86c5 0 7-6 4-9-7-7-13-15-13-37 0-19-14-34-34-34z"
          fill="#ffffff"/>
    <path d="M-12 44a12 12 0 0 0 24 0z" fill="#ffffff"/>
    <path d="M0-50v-10" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M56-42a54 54 0 0 1 14 34"/>
      <path d="M-56-42a54 54 0 0 0-14 34"/>
    </g>
  </g>
  <path d="M854 330h-140" stroke="#1e7a4e" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="2 16" fill="none" opacity="0.6"/>
  <path d="M726 322l-12 8 12 8" stroke="#1e7a4e" stroke-width="5" stroke-linecap="round"
        stroke-linejoin="round" fill="none" opacity="0.6"/>
</svg>
