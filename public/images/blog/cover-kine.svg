<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Une série de séances posées sur plusieurs semaines">
  <!-- Couverture : « Agenda en ligne pour kinésithérapeute »
       Une série de séances alignées sur six semaines, dont une déplacée : le
       point central de l'article, à savoir que les séances sont indépendantes
       et qu'en bouger une ne bouge pas les autres. -->
  <rect width="1200" height="750" fill="#f2f7f4"/>

  <rect x="100" y="110" width="1000" height="540" rx="30" fill="#ffffff"/>
  <rect x="100" y="110" width="1000" height="88" rx="30" fill="#1e7a4e"/>
  <rect x="100" y="168" width="1000" height="30" fill="#1e7a4e"/>
  <g fill="#ffffff" opacity="0.85">
    <rect x="146" y="147" width="150" height="14" rx="7"/>
    <rect x="960" y="147" width="94" height="14" rx="7" opacity="0.6"/>
  </g>

  <!-- Colonnes de semaines -->
  <g fill="#0f2419" opacity="0.16">
    <rect x="160" y="240" width="100" height="12" rx="6"/>
    <rect x="310" y="240" width="100" height="12" rx="6"/>
    <rect x="460" y="240" width="100" height="12" rx="6"/>
    <rect x="610" y="240" width="100" height="12" rx="6"/>
    <rect x="760" y="240" width="100" height="12" rx="6"/>
    <rect x="910" y="240" width="100" height="12" rx="6"/>
  </g>
  <g stroke="#0f2419" stroke-opacity="0.08" stroke-width="2">
    <path d="M285 230v380M435 230v380M585 230v380M735 230v380M885 230v380"/>
  </g>

  <!-- Séances : même créneau chaque semaine -->
  <g>
    <rect x="160" y="310" width="100" height="86" rx="16" fill="#1e7a4e"/>
    <rect x="310" y="310" width="100" height="86" rx="16" fill="#1e7a4e"/>
    <rect x="460" y="310" width="100" height="86" rx="16" fill="#1e7a4e"/>
    <!-- Celle-ci a été déplacée : les autres n'ont pas bougé -->
    <rect x="610" y="452" width="100" height="86" rx="16" fill="#e8a33d"/>
    <rect x="760" y="310" width="100" height="86" rx="16" fill="#1e7a4e"/>
    <rect x="910" y="310" width="100" height="86" rx="16" fill="#1e7a4e"/>
  </g>

  <!-- Emplacement libéré par la séance déplacée -->
  <rect x="610" y="310" width="100" height="86" rx="16" fill="none"
        stroke="#e8a33d" stroke-width="4" stroke-dasharray="12 10" opacity="0.8"/>

  <!-- Flèche du déplacement -->
  <g fill="none" stroke="#e8a33d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M660 404v34"/>
    <path d="M648 428l12 14 12-14"/>
  </g>

  <!-- Fil reliant les séances restées en place -->
  <path d="M210 353h250M810 353h100" stroke="#1e7a4e" stroke-width="4"
        stroke-dasharray="3 12" stroke-linecap="round" opacity="0.5"/>

  <!-- Compteur de séances -->
  <g transform="translate(600 600)">
    <rect x="-130" y="-30" width="260" height="60" rx="30" fill="#eef6f1"/>
    <circle cx="-92" cy="0" r="16" fill="#1e7a4e"/>
    <path d="M-100 0l6 7 12-14" fill="none" stroke="#ffffff" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-62" y="-7" width="170" height="14" rx="7" fill="#0f2419" opacity="0.25"/>
  </g>
</svg>
